services:
  - type: web
    name: maqsuud-ict-pos-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: TIDB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
